# NeoForge mod metadata for NeoServerStats Placeholder.
# Standard TOML format (v0.5.0). Placeholders are expanded by the generateModMetadata Gradle task.

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

# The license for this mod.
license="${mod_license}"

# This mod only ever runs on a dedicated server: its entrypoint is annotated with
# @Mod(dist = Dist.DEDICATED_SERVER), and every dependency below is declared server-side.
showAsResourcePack=false

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="davidblackcn" #optional
description='''
Server and player runtime statistics exposed as placeholders through Forge PlaceholderAPI.

Server-only mod. Provides no client features, no GUI, no commands beyond a placeholder debugging aid.
'''

# ---------------------------------------------------------------------------------------------
# Dependencies
#
# All dependencies are declared with side="SERVER": this is a dedicated-server mod, so a client
# should not be forced to install NeoForge PlaceholderAPI (or this mod) at all.
# ---------------------------------------------------------------------------------------------

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

# Forge PlaceholderAPI (EnvyWare). This mod registers its placeholders through FPAPI and cannot do
# anything useful without it.
#
# NOTE: the released ForgePlaceholderAPI-NeoForge-2.1.0-1.21.1.jar declares version="2.0.5" in its own
# metadata file, so FML sees the mod version as 2.0.5. The range below is chosen to accept that.
[[dependencies.${mod_id}]]
modId="forgeplaceholderapi"
type="required"
versionRange="${forge_placeholder_api_range}"
ordering="AFTER"
side="SERVER"
